<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Stopwatch body -->
  <circle cx="32" cy="36" r="24" fill="none" stroke="#00E676" stroke-width="4"/>
  <!-- Top button -->
  <rect x="29" y="6" width="6" height="8" rx="2" fill="#00E676"/>
  <!-- Side button -->
  <rect x="48" y="16" width="8" height="4" rx="1.5" fill="#00E676" transform="rotate(30 52 18)"/>
  <!-- Minute hand -->
  <line x1="32" y1="36" x2="32" y2="20" stroke="#00E676" stroke-width="3" stroke-linecap="round"/>
  <!-- Second hand -->
  <line x1="32" y1="36" x2="44" y2="30" stroke="#FFD600" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="36" r="2.5" fill="#00E676"/>
</svg>
